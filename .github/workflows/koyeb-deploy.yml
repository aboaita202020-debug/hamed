name: Deploy Hamed to Koyeb

# Deployments are intentionally manual. Pre-launch CI must be green before
# an operator starts this workflow; no push to main can deploy by accident.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.KOYEB_API_TOKEN != '' }}
    steps:
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Deploy Hamed from GitHub
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$OPENAI_API_KEY"
          koyeb apps init hamed \
            --git https://github.com/aboaita202020-debug/hamed \
            --git-branch main \
            --git-builder docker \
            --instance-type nano \
            --ports 8000:http \
            --routes /:8000 \
            --env HAMED_HOST=0.0.0.0 \
            --env HAMED_PORT=8000 \
            --env "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            --env "OPENAI_API_KEY=$OPENAI_API_KEY" \
            --token "$KOYEB_API_TOKEN"
