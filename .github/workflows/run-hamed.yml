name: Hamed AI - Free Runner

on:
  workflow_dispatch:
  push:
    branches: [feat/hamed-phase2-core]

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Validate Python
        run: python -m compileall -q .
      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo 'No tests directory; validation completed.'; fi
