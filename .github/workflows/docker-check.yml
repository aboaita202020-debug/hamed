name: Hamed Docker Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python syntax check
        run: python -m compileall -q bot.py app tests

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run full Python test suite
        env:
          TELEGRAM_BOT_TOKEN: 12345:TEST_TOKEN_PLACEHOLDER
          OPENAI_API_KEY: sk-test-placeholder
          HAMED_FREE_ONLY: "0"
        run: PYTHONPATH=. pytest -q

      - name: Build Hamed image
        run: docker build -t hamed:ci .

      - name: Run health check with offline non-secret CI placeholders
        run: |
          set -euo pipefail
          docker run -d --name hamed-ci -p 8000:8000 \
            -e TELEGRAM_BOT_TOKEN=12345:TEST_TOKEN_PLACEHOLDER \
            -e OPENAI_API_KEY=sk-test-placeholder \
            -e HAMED_FREE_ONLY=0 \
            -e HAMED_TELEGRAM_POLLING=false \
            -e HAMED_WORKER_ENABLED=false \
            hamed:ci
          trap 'docker logs hamed-ci || true; docker rm -f hamed-ci || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Docker health smoke test: PASS"
              exit 0
            fi
            sleep 2
          done
          docker logs hamed-ci
          exit 1
