name: Hamed AI Prelaunch Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prelaunch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: test-token-placeholder
          OPENAI_API_KEY: test-key-placeholder
        run: PYTHONPATH=. pytest -q

      - name: Docker build
        run: docker build -t hamed-prelaunch .

      - name: Docker smoke test
        run: |
          set -euo pipefail
          docker run -d --name hamed-smoke \
            -e TELEGRAM_BOT_TOKEN=test-token-placeholder \
            -e OPENAI_API_KEY=test-key-placeholder \
            -e HAMED_WORKER_ENABLED=false \
            -p 8080:8000 hamed-prelaunch
          trap 'docker logs hamed-smoke || true; docker rm -f hamed-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo
              echo "Docker smoke test: PASS"
              exit 0
            fi
            sleep 2
          done
          echo "Docker smoke test: FAIL"
          docker ps -a --filter name=hamed-smoke
          docker logs hamed-smoke
          exit 1
