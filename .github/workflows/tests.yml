name: Hamed AI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Syntax check
        run: python -m compileall -q bot.py app tests

      - name: Full test suite
        env:
          TELEGRAM_BOT_TOKEN: 12345:TEST_TOKEN_PLACEHOLDER
          OPENAI_API_KEY: sk-test-placeholder
        run: PYTHONPATH=. pytest -q

      - name: Docker build
        run: docker build -t hamed-ai:ci .

      - name: Docker health smoke test
        run: |
          set -euo pipefail
          cleanup() {
            docker logs hamed-ci || true
            docker rm -f hamed-ci || true
          }
          trap cleanup EXIT
          docker run -d --name hamed-ci -p 8000:8000 \
            -e TELEGRAM_BOT_TOKEN=12345:TEST_TOKEN_PLACEHOLDER \
            -e OPENAI_API_KEY=sk-test-placeholder \
            -e HAMED_TELEGRAM_POLLING=false \
            -e HAMED_AUTONOMOUS_MODE=false \
            -e HAMED_WORKER_ENABLED=false \
            -e HAMED_HOST=0.0.0.0 \
            -e HAMED_PORT=8000 \
            hamed-ai:ci
          for i in $(seq 1 30); do
            if health=$(curl -fsS http://127.0.0.1:8000/health) && \
              python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "ok"' <<<"$health"; then
              echo "$health"
              echo
              echo "Docker health smoke test: PASS"
              exit 0
            fi
            sleep 2
          done
          echo "Docker health smoke test: FAIL"
          docker ps -a --filter name=hamed-ci
          docker logs hamed-ci
          exit 1
