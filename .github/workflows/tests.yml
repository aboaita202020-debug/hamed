name: Hamed AI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q bot.py app tests
      - name: Full test suite
        env:
          TELEGRAM_BOT_TOKEN: 12345:TEST_TOKEN_PLACEHOLDER
          OPENAI_API_KEY: sk-test-placeholder
        run: PYTHONPATH=. pytest -q
