name: Northflank Docker readiness

# Keep the provider-specific readiness check available on demand without
# duplicating the main CI run on every push.
on:
  workflow_dispatch:

jobs:
  docker-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: 12345:TEST_TOKEN_PLACEHOLDER
          OPENAI_API_KEY: sk-test-placeholder
        run: PYTHONPATH=. pytest -q

      - name: Build image
        run: docker build -t hamed-ai:ci .

      - name: Run container and verify health
        run: |
          set -euo pipefail
          docker run -d --name hamed-ci -p 8000:8000 \
            -e TELEGRAM_BOT_TOKEN=12345:TEST_TOKEN_PLACEHOLDER \
            -e OPENAI_API_KEY=sk-test-placeholder \
            -e HAMED_TELEGRAM_POLLING=false \
            -e HAMED_WORKER_ENABLED=false \
            -e HAMED_HOST=0.0.0.0 \
            -e HAMED_PORT=8000 \
            hamed-ai:ci
          trap 'docker logs hamed-ci || true; docker rm -f hamed-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Northflank Docker readiness: PASS"
              exit 0
            fi
            sleep 2
          done
          echo "Northflank Docker readiness: FAIL"
          docker ps -a --filter name=hamed-ci
          docker logs hamed-ci
          exit 1
