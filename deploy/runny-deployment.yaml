# Hamed AI — JustRunMy.App / Runny deployment contract
#
# Declarative deployment documentation. No real secrets.

version: 1
application: hamed-ai
runtime:
  entrypoint: python bot.py
  healthcheck: python -m pytest -q

required_environment:
  - TELEGRAM_BOT_TOKEN
  - OPENAI_API_KEY

optional_environment:
  persistence:
    - DATABASE_URL

  ai_brains:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_MODEL
    - DEEPSEEK_API_KEY
    - DEEPSEEK_MODEL
    - KIMI_API_KEY
    - KIMI_MODEL
    - GEMINI_API_KEY
    - GEMINI_MODEL
    - MISTRAL_API_KEY
    - MISTRAL_MODEL
    - QWEN_API_KEY
    - QWEN_MODEL
    - XAI_API_KEY
    - XAI_MODEL
    - GROK_API_KEY
    - GROK_MODEL
    - LLAMA_API_KEY
    - LLAMA_MODEL
    - GROQ_API_KEY
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL

  telegram:
    - TELEGRAM_CHAT_ID

  twilio:
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
    - TWILIO_FROM_NUMBER

  paymob:
    - PAYMOB_API_KEY
    - PAYMOB_PUBLIC_KEY
    - PAYMOB_HMAC_SECRET
    - PAYMOB_INTEGRATION_ID
    - PAYMOB_BASE_URL

  runtime:
    - HAMED_TELEGRAM_POLLING
    - HAMED_WORKER_ENABLED
    - APP_ENV
    - LOG_LEVEL

rules:
  - name: telegram_standalone
    description: Telegram bot must run with only TELEGRAM_BOT_TOKEN and OPENAI_API_KEY.
  - name: database_optional
    description: DATABASE_URL is optional; local/default persistence is used when absent.
  - name: twilio_optional
    description: Missing Twilio variables disable voice integration and never block deployment.
  - name: paymob_optional
    description: Missing Paymob variables disable payment integration and never block deployment.
  - name: ai_brains_optional
    description: Missing provider keys disable only that provider; configured providers are routed with fallback.
  - name: no_fake_secrets
    description: Never invent placeholder credentials.
  - name: no_secret_storage
    description: Never commit real API keys, tokens, auth tokens, or payment credentials.

runny_agent_instructions:
  required_inputs: [TELEGRAM_BOT_TOKEN, OPENAI_API_KEY]
  do_not_block_on:
    - DATABASE_URL
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
    - TWILIO_FROM_NUMBER
    - PAYMOB_API_KEY
    - PAYMOB_PUBLIC_KEY
    - PAYMOB_HMAC_SECRET
    - PAYMOB_INTEGRATION_ID
  deployment_mode: telegram-first
