name: Build PythonAnywhere ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment ZIP
        run: git archive --format=zip --output=orvia-pythonanywhere.zip HEAD
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: orvia-pythonanywhere
          path: orvia-pythonanywhere.zip
          retention-days: 7
